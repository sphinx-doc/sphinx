name: Render documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  UV_SYSTEM_PYTHON: "1"  # make uv do global installs

jobs:
  verbose:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3"
    - name: Install graphviz
      run: |
        sudo apt-get install --no-install-recommends --yes graphviz
        # Since graphviz 13, each layout engine is shipped as a separate plugin
        # package that is only pulled in through Recommends.  Install the neato
        # layout plugin explicitly (when it is packaged separately), otherwise
        # `neato` fails with: There is no layout engine support for "neato".
        neato_plugin="$(apt-cache search --names-only 'libgvplugin-neato-layout' | grep -v -- '-dbgsym$' | awk '{print $1}' | head -n 1)"
        if [ -n "$neato_plugin" ]; then
          sudo apt-get install --no-install-recommends --yes "$neato_plugin"
        fi
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: latest
        enable-cache: false
    - name: Install dependencies
      run: uv pip install . --group docs
    - name: Render the documentation
      run: >
        sphinx-build
        -M html ./doc ./build/sphinx
        --verbose
        --jobs=auto
        --show-traceback
        --fail-on-warning
